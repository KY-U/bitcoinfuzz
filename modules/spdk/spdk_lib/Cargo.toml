[lib]
name = "spdk_lib"
crate-type = ["staticlib"]

[package]
name = "spdk_lib"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4.3"
# Only the sending half of the crate is exercised by this target, and dropping
# the default features also drops serde and the receiving code from the build.
silentpayments = { git = "https://github.com/cygnet3/spdk", rev = "eb82e8f99f3838d882de960ff26974d04463abbb", default-features = false, features = [
    "sending",
] }
