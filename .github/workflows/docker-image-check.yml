name: Docker Image Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'

jobs:
  select-modules:
    runs-on: ubuntu-24.04
    outputs:
      cxxflags: ${{ steps.detect.outputs.cxxflags }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules and resolve CXXFLAGS
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          ./.github/scripts/select-cxxflags.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: select-modules
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: libfuzzer
            dockerfile: Dockerfile
          - name: afl
            dockerfile: Dockerfile.afl
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ${{ matrix.image.name }} Docker image
        run: |
          docker build -f ${{ matrix.image.dockerfile }} \
            -t bitcoinfuzz:image-check-${{ matrix.image.name }} \
            --build-arg FUZZ=image-check \
            --build-arg CXXFLAGS="${{ needs.select-modules.outputs.cxxflags }}" \
            .
